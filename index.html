<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THT Live Productions Workspace</title>
    <!-- Core Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--surface-color);
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        /* Send Request Button Styling */
        #sendRequestBtn {
            background-color: var(--primary-color);
            color: white;
        }

        #sendRequestBtn:hover {
            background-color: #0056b3;
        }

        #sendRequestBtn:active {
            transform: scale(0.98);
        }

        .secondary-btn {
            background-color: #333;
            color: #eee;
        }

        .secondary-btn:hover {
            background-color: #444;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Select a Movie Manager</h2>
        <p>Access your private real-time studio assets or request administrative verification below.</p>
        
        <div class="btn-group">
            <!-- The updated verification action button requested -->
            <button id="sendRequestBtn" onclick="handleRequestEmail()">Send Request to Admin</button>
            
            <!-- Contextual navigation button -->
            <button class="secondary-btn" onclick="window.location.reload();">Refresh Workspace</button>
        </div>
    </div>

    <script>
        // Line 206: Ensure your Firebase configuration block stays intact here
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        /**
         * Triggers the workflow to log or send a verification request
         */
        function handleRequestEmail() {
            console.log("Initiating request to administrator...");
            
            // Temporary feedback state for the UI
            const btn = document.getElementById("sendRequestBtn");
            const originalText = btn.innerText;
            
            btn.innerText = "Sending...";
            btn.disabled = true;

            // Example integration logic (e.g., writing a flag to your Realtime Database)
            // firebase.database().ref('adminRequests/' + userId).set({ requestedAt: Date.now() })
            
            setTimeout(() => {
                alert("Your access request has been compiled and logged for the administrator.");
                btn.innerText = originalText;
                btn.disabled = false;
            }, 1000);
        }
    </script>
</body>
</html>
